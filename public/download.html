<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下载中心</title>
<link rel="stylesheet" href="/assets/css/download.css">
<a class="back" href="/">← 返回首页</a>
<h1>下载中心</h1>
<div class="sub">文件目录 <code>/srv/downloads/files</code> · <a href="/files/">浏览文件列表</a> · 删除需要密码</div>

<div class="bar">
  <input id="pw" type="password" placeholder="删除密码" autocomplete="off">
  <button id="save">保存密码</button>
  <button id="refresh">刷新</button>
</div>

<p id="deleteStatus" role="status" aria-live="polite"></p>
<table>
  <thead><tr><th>文件名</th><th style="width:90px">大小</th><th style="width:160px">时间</th><th style="width:140px"></th></tr></thead>
  <tbody id="rows"><tr><td colspan="4" class="muted">加载中…</td></tr></tbody>
</table>

<div id="qrbox" onclick="if(event.target===this)closeQR()">
  <div class="card">
    <div class="name" id="qrname"></div>
    <div id="qrimg"></div>
    <div class="url" id="qrurl"></div>
    <div style="margin-top:12px"><button onclick="closeQR()">关闭</button></div>
  </div>
</div>

<script src="/assets/qrcode.min.js"></script>
<script src="/assets/js/download.js"></script>
