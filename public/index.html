<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FDF7EC">
<title>sjdhqtl.cloud</title>
<style>
  :root{
    --bg:#FDF7EC;
    --ink:#2E2A26;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100svh;
    display:grid;
    place-items:center;
    color:var(--ink);
    background:
      radial-gradient(1200px 760px at 50% -12%, #FFF9EC 0%, rgba(255,249,236,0) 62%),
      radial-gradient(820px 620px at 86% 94%, rgba(214,240,228,.42) 0%, rgba(214,240,228,0) 66%),
      radial-gradient(860px 640px at 10% 98%, rgba(255,222,196,.52) 0%, rgba(255,222,196,0) 64%),
      var(--bg);
    overflow-x:hidden;
  }
  /* 细点阵：科技感底纹，中心清晰、四周淡出 */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:radial-gradient(rgba(126,106,82,.15) 1px, transparent 1.4px);
    background-size:24px 24px;
    -webkit-mask-image:radial-gradient(ellipse 72% 64% at 50% 44%, #000 12%, transparent 78%);
    mask-image:radial-gradient(ellipse 72% 64% at 50% 44%, #000 12%, transparent 78%);
  }
  /* 顶部一道细光带 */
  body::after{
    content:"";
    position:fixed;
    top:0;
    left:50%;
    width:min(720px,90vw);
    height:1px;
    transform:translateX(-50%);
    background:linear-gradient(90deg,transparent,rgba(34,183,154,.45),transparent);
    pointer-events:none;
  }
  .stage{
    display:grid;
    place-items:center;
    padding:24px;
  }
  .mac-link{
    position:relative;
    display:block;
    width:min(52vmin,340px);
    isolation:isolate;
    -webkit-tap-highlight-color:transparent;
    border-radius:16px;
    animation:float 7s ease-in-out infinite;
    filter:drop-shadow(0 26px 34px rgba(112,84,48,.17)) drop-shadow(0 5px 10px rgba(112,84,48,.07));
  }
  .mac-link:focus-visible{outline:none}
  .mac-link:focus-visible .mac{
    outline:3px solid rgba(34,183,154,.6);
    outline-offset:12px;
    border-radius:14px;
  }
  /* 终端关闭后把焦点还给图标，但不画焦点框；用 Tab 导航时再恢复 */
  html.quiet-focus .mac-link:focus-visible .mac{outline:none}
  /* 图标背后的柔光：青绿 + 暖橙 */
  .halo{
    position:absolute;
    left:50%;
    top:52%;
    width:190%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      radial-gradient(circle, rgba(88,226,199,.20) 0%, rgba(255,196,138,.15) 44%, rgba(255,255,255,0) 68%);
    filter:blur(4px);
    z-index:-1;
    pointer-events:none;
  }
  .mac{
    display:block;
    width:100%;
    height:auto;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), filter .35s;
    will-change:transform;
  }
  .mac-link:hover .mac{
    transform:translateY(-5px) scale(1.02);
    filter:drop-shadow(0 8px 10px rgba(112,84,48,.10));
  }
  /* CRT 光束：悬停时匀速自上而下扫过屏幕，进出时淡入淡出 */
  .crt-sweep,.crt-pulse{opacity:0}
  @media (hover:hover){
    .mac-link:hover .crt-sweep{
      animation:crtMove 2.6s linear infinite, crtFade 2.6s linear infinite;
    }
    .mac-link:hover .crt-pulse{animation:crtPulse 2.6s linear infinite}
  }
  /* 终端打开时，背后的图标不再跑动画 */
  html.term-open .mac-link:hover .crt-sweep,
  html.term-open .mac-link:hover .crt-pulse{animation:none;opacity:0}
  /* 位移匀速；透明度单独走「先缓后急」的曲线 */
  @keyframes crtMove{
    0%{transform:translateY(1px)}
    100%{transform:translateY(12px)}
  }
  @keyframes crtFade{
    0%{opacity:0;animation-timing-function:cubic-bezier(.5,0,.85,.38)}
    30%{opacity:.5}
    70%{opacity:.5;animation-timing-function:cubic-bezier(.5,0,.85,.38)}
    100%{opacity:0}
  }
  @keyframes crtPulse{
    0%,100%{opacity:0}
    50%{opacity:.055}
  }
  .mac-link:active .mac{
    transform:translateY(-1px) scale(.995);
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }
  @media (prefers-reduced-motion:reduce){
    .mac-link{animation:none}
    .mac{transition:none}
  }

  /* ===== 伪终端入口 ===== */
  html.term-open,html.term-open body{overflow:hidden}

  .term-dialog{
    width:min(680px,92vw);
    height:min(56svh,400px);
    max-width:none;
    max-height:none;
    padding:0;
    border:0;
    background:transparent;
    color:#CDEFE4;
    overflow:visible;
    transition:width .32s cubic-bezier(.2,.8,.2,1),height .32s cubic-bezier(.2,.8,.2,1);
  }
  /* 最大化：铺满视口，上限 1920×1080，保留圆角 */
  .term-dialog.max{
    width:min(1920px,100vw);
    height:min(1080px,100vh);
  }
  .term-dialog::backdrop{
    background:rgba(38,28,16,.26);
    -webkit-backdrop-filter:blur(3px) saturate(.9);
    backdrop-filter:blur(3px) saturate(.9);
  }
  .term-dialog[open]{animation:termIn .3s cubic-bezier(.2,.8,.2,1)}
  .term-dialog.closing{animation:termOut .16s ease forwards}
  @keyframes termIn{
    from{opacity:0;transform:translateY(10px) scale(.94)}
    to{opacity:1;transform:none}
  }
  @keyframes termOut{
    to{opacity:0;transform:translateY(6px) scale(.97)}
  }

  .term{
    position:relative;
    display:flex;
    flex-direction:column;
    height:100%;
    border-radius:12px;
    background:#08120F;
    border:1px solid rgba(120,230,200,.22);
    box-shadow:
      0 34px 80px rgba(46,30,10,.34),
      0 0 0 1px rgba(0,0,0,.22),
      0 0 70px rgba(60,220,190,.10);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
    font-size:13.5px;
    line-height:1.65;
    overflow:hidden;
    color-scheme:dark;
  }
  /* CRT 扫描线 */
  .term::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);
    opacity:.5;
  }
  .term-bar{
    display:flex;
    align-items:center;
    gap:7px;
    flex:none;
    padding:10px 12px;
    background:#0E1E1A;
    border-bottom:1px solid rgba(120,230,200,.12);
  }
  .dot{
    position:relative;
    flex:none;
    width:10px;
    height:10px;
    padding:0;
    border:0;
    border-radius:50%;
    background:#3B524B;
  }
  .dot.red{background:#E5695B}
  .dot.yellow{background:#E0B354}
  .dot.green{background:#5FBF7A}
  /* 左上角红绿灯：扩大点击热区，视觉仍是 10px */
  button.dot{cursor:pointer}
  button.dot::after{content:"";position:absolute;inset:-9px;border-radius:50%}
  button.dot:focus-visible{outline:2px solid rgba(255,255,255,.75);outline-offset:3px}
  /* macOS 手感：悬停标题栏时浮出 × / − / + */
  .dot::before{
    content:"";
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-size:9px;
    line-height:1;
    font-weight:700;
    color:rgba(35,20,8,.62);
    opacity:0;
    transition:opacity .15s;
  }
  .term-bar:hover .dot.red::before{content:"×";opacity:1}
  .term-bar:hover .dot.yellow::before{content:"−";opacity:1}
  .term-bar:hover .dot.green::before{content:"+";opacity:1}
  .term-dialog.max .term-bar:hover .dot.green::before{content:"−"}
  .term-title{
    margin-left:8px;
    flex:1;
    font-size:12px;
    letter-spacing:.03em;
    color:#7FB4A6;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .term-body{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:14px 16px 16px;
    background:radial-gradient(120% 90% at 50% 0%,rgba(50,200,170,.075),transparent 62%),#07100E;
    text-shadow:0 0 10px rgba(95,227,201,.12);
    overscroll-behavior:contain;
  }
  .ln{white-space:pre-wrap;word-break:break-word}
  .dim{color:#6E9E90}
  .cmd{color:#B9E9DC}
  .ok{color:#7CF0D8}
  .err{color:#FFA18D}
  .term-line{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-top:2px;
  }
  .prompt{flex:none;color:#5FE3C9;white-space:nowrap}
  .term-line input{
    flex:1;
    min-width:0;
    padding:0;
    border:0;
    outline:none;
    background:none;
    color:#E4FFF8;
    font:inherit;
    caret-color:#5FE3C9;
  }
  .term-line input:disabled{opacity:.45}

  /* ===== /dl TUI ===== */
  .term-tui{display:none;flex:1;min-height:0;flex-direction:column}
  .term-dialog.tui .term-log,
  .term-dialog.tui .term-line{display:none}
  .term-dialog.tui .term-tui{display:flex}
  .term-dialog.tui .term-body{display:flex;flex-direction:column;overflow:hidden}
  .tui-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    flex:none;
    padding:0 4px 8px;
    border-bottom:1px solid rgba(95,227,201,.18);
    color:#7FB4A6;
    font-size:12px;
    letter-spacing:.04em;
  }
  .tui-head b{color:#5FE3C9;font-weight:600}
  .tui-cols{
    display:grid;
    grid-template-columns:minmax(0,1fr) 96px 150px;
    gap:18px;
    flex:none;
    padding:7px 12px 5px;
    color:#54786E;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
  }
  .tui-list{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:2px 0 6px;
    outline:none;
    scrollbar-width:thin;
    scrollbar-color:rgba(95,227,201,.35) transparent;
  }
  .tui-list:focus-visible{outline:none}
  .tui-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) 96px 150px;
    gap:18px;
    align-items:baseline;
    padding:3px 12px;
    border-radius:2px;
    color:#CDEFE4;
    cursor:pointer;
  }
  .tui-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tui-row.dir .n{color:#8FE9D6}
  .tui-row.dir.sel .n{color:#0A2A23}
  .tui-row.up .n{color:#7FB4A6}
  .tui-row .s,.tui-row .d{color:#6E9E90;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tui-row:hover{background:rgba(95,227,201,.07)}
  .tui-row.sel{background:#5FE3C9;color:#06120F}
  .tui-row.sel .s,.tui-row.sel .d{color:#0A2A23}
  .tui-empty{padding:10px 12px;color:#6E9E90}
  .tui-foot{
    display:flex;
    flex-wrap:wrap;
    gap:6px 18px;
    flex:none;
    padding-top:8px;
    border-top:1px solid rgba(95,227,201,.18);
    color:#54786E;
    font-size:12px;
  }
  .tui-foot b{color:#8FD9C8;font-weight:500}

  @media (max-width:520px){
    .term-dialog{height:min(64svh,440px)}
    .term{font-size:16px}
    .tui-cols,.tui-row{grid-template-columns:minmax(0,1fr) 84px}
    .tui-cols span:nth-child(3),.tui-row .d{display:none}
    .term-body{padding:12px}
    .term-title{font-size:11px}
  }
  @media (prefers-reduced-motion:reduce){
    .term-dialog,.term{transition:none}
    .term-dialog[open],.term-dialog.closing{animation:none}
    .mac-link:hover .crt-sweep,
    .mac-link:hover .crt-pulse{animation:none;opacity:0}
  }
</style>
</head>

x="6" y="22" width="18" height="1" fill="#F1E2C6"/><rect x="24" y="22" width="1" height="1" fill="#DCC5A2"/><rect x="25" y="22" width="1" height="1" fill="#7E6A52"/><rect x="4" y="23" width="1" height="1" fill="#7E6A52"/><rect x="5" y="23" width="1" height="1" fill="#FFFCF0"/><rect x="6" y="23" width="18" height="1" fill="#F1E2C6"/><rect x="24" y="23" width="1" height="1" fill="#DCC5A2"/><rect x="25" y="23" width="1" height="1" fill="#7E6A52"/><rect x="4" y="24" width="1" height="1" fill="#7E6A52"/><rect x="5" y="24" width="1" height="1" fill="#FFFCF0"/><rect x="6" y="24" width="18" height="1" fill="#F1E2C6"/><rect x="24" y="24" width="1" height="1" fill="#DCC5A2"/><rect x="25" y="24" width="1" height="1" fill="#7E6A52"/><rect x="4" y="25" width="1" height="1" fill="#7E6A52"/><rect x="5" y="25" width="20" height="1" fill="#DCC5A2"/><rect x="25" y="25" width="1" height="1" fill="#7E6A52"/><rect x="5" y="26" width="20" height="1" fill="#7E6A52"/><rect x="9" y="27" width="12" height="1" fill="#C5A87F"/><rect x="9" y="28" width="12" height="1" fill="#DCC5A2"/><rect x="9" y="29" width="1" height="1" fill="#DCC5A2"/><rect x="10" y="29" width="10" height="1" fill="#7E6A52"/><rect x="20" y="29" width="1" height="1" fill="#DCC5A2"/>

<dialog id="termDlg" class="term-dialog" aria-labelledby="termTitle">
  <div class="term">
    <div class="term-bar">
      <button type="button" class="dot red" id="termClose" aria-label="关闭终端" title="关闭"></button>
      <span class="dot yellow" aria-hidden="true"></span>
      <button type="button" class="dot green" id="termMax" aria-label="最大化" title="最大化"></button>
      <span class="term-title" id="termTitle">sjdhqtl — terminal</span>
    </div>
    <div class="term-body" id="termBody">
      <div class="term-log" id="termLog" role="log" aria-live="polite" aria-label="终端输出"></div>
      <form class="term-line" id="termForm">
        <label class="prompt" for="termInput">admin@sjdhqtl:~$</label>
        <input id="termInput" type="text" inputmode="text" enterkeyhint="go"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
               aria-label="终端命令输入">
      </form>
      <div class="term-tui" id="termTui">
        <div class="tui-head">
          <span>SJDHQTL <b id="tuiPath">/dl</b></span>
          <span id="tuiMeta">loading…</span>
        </div>
        <div class="tui-cols" aria-hidden="true"><span>name</span><span>size</span><span>modified</span></div>
        <div class="tui-list" id="tuiList" tabindex="0" role="listbox" aria-label="下载文件列表"></div>
        <div class="tui-foot">
          <span><b>↑↓</b> select</span>
          <span><b>⏎</b> open</span>
          <span><b>⌫</b> up</span>
          <span><b>Ctrl+R</b> refresh</span>
          <span><b>Ctrl+Q</b> back</span>
        </div>
      </div>
    </div>
  </div>
</dialog>

<script>
(() => {
  const dlg = document.getElementById('termDlg');
  const log = document.getElementById('termLog');
  const body = document.getElementById('termBody');
  const form = document.getElementById('termForm');
  const input = document.getElementById('termInput');
  const closeBtn = document.getElementById('termClose');
  const tui = document.getElementById('termTui');
  const tuiList = document.getElementById('tuiList');
  const tuiMeta = document.getElementById('tuiMeta');
  const link = document.querySelector('.mac-link');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const PROMPT = 'admin@sjdhqtl:~$';
  let opening = false;
  let navigating = false;

  function append(node) {
    log.append(node);
    while (log.childElementCount > 240) log.firstElementChild.remove();
    body.scrollTop = body.scrollHeight;
  }
  function line(text, cls) {
    const d = document.createElement('div');
    d.className = 'ln' + (cls ? ' ' + cls : '');
    d.textContent = text || '\u00a0';
    append(d);
  }
  function rich(parts) {
    const d = document.createElement('div');
    d.className = 'ln';
    for (const [text, cls] of parts) {
      const s = document.createElement('span');
      s.textContent = text;
      if (cls) s.className = cls;
      d.append(s);
    }
    append(d);
  }

  // ---------- /dl TUI ----------
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let tuiFiles = [];
  let tuiSel = 0;
  let tuiSeq = 0;
  let tuiPath = [];
  const tuiPathEl = document.getElementById('tuiPath');
  const tuiWhere = () => '/dl' + (tuiPath.length ? '/' + tuiPath.join('/') : '');

  function fmtSize(n) {
    if (!n) return '0 B';
    if (n < 1024) return n + ' B';
    const u = ['KB', 'MB', 'GB', 'TB'];
    let i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return n.toFixed(1) + ' ' + u[i];
  }
  function fmtDate(value) {
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '';
    const p = (v) => String(v).padStart(2, '0');
    return `${MONTHS[d.getMonth()]} ${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function selectRow(i, scroll) {
    if (!tuiFiles.length) return;
    tuiSel = Math.max(0, Math.min(tuiFiles.length - 1, i));
    const rows = tuiList.querySelectorAll('.tui-row');
    rows.forEach((r, j) => {
      const on = j === tuiSel;
      r.classList.toggle('sel', on);
      r.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    tuiList.setAttribute('aria-activedescendant', 'tui-row-' + tuiSel);
    if (scroll && rows[tuiSel]) rows[tuiSel].scrollIntoView({ block: 'nearest' });
  }

  function downloadRow() {
    const f = tuiFiles[tuiSel];
    if (!f || f.type !== 'file') return;
    const rel = [...tuiPath, f.name].map(encodeURIComponent).join('/');
    location.href = '/files/' + rel;
  }

  function openSelected() {
    const f = tuiFiles[tuiSel];
    if (!f) return;
    if (f.type === 'up') {
      tuiPath.pop();
      loadTui();
      return;
    }
    if (f.type === 'directory') {
      tuiPath.push(f.name);
      loadTui();
      return;
    }
    downloadRow();
  }

  function renderTui() {
    tuiList.replaceChildren();
    if (!tuiFiles.length) {
      const e = document.createElement('div');
      e.className = 'tui-empty';
      e.textContent = 'empty directory';
      tuiList.append(e);
      tuiMeta.textContent = '0 items';
      return;
    }
    const dirs = tuiFiles.filter((f) => f.type === 'directory').length;
    const filesN = tuiFiles.filter((f) => f.type === 'file').length;
    const total = tuiFiles.reduce((a, f) => a + (f.type === 'file' ? (f.size || 0) : 0), 0);
    const parts = [];
    if (dirs) parts.push(dirs + ' dir' + (dirs > 1 ? 's' : ''));
    parts.push(filesN + ' file' + (filesN > 1 ? 's' : ''));
    tuiMeta.textContent = parts.join(' · ') + ' · ' + fmtSize(total);
    tuiFiles.forEach((f, i) => {
      const row = document.createElement('div');
      row.className = 'tui-row' + (f.type === 'directory' ? ' dir' : '') + (f.type === 'up' ? ' up' : '');
      row.id = 'tui-row-' + i;
      row.dataset.i = i;
      row.setAttribute('role', 'option');
      const n = document.createElement('span'); n.className = 'n';
      n.textContent = f.type === 'directory' ? f.name + '/' : f.name;
      const z = document.createElement('span'); z.className = 's';
      z.textContent = f.type === 'directory' ? 'DIR' : f.type === 'file' ? fmtSize(f.size) : '';
      const d = document.createElement('span'); d.className = 'd';
      d.textContent = f.type === 'up' ? '' : fmtDate(f.mtime);
      row.append(n, z, d);
      tuiList.append(row);
    });
    selectRow(tuiSel, true);
  }

  async function loadTui() {
    const seq = ++tuiSeq;
    const where = tuiWhere();
    tuiMeta.textContent = 'loading…';
    tuiList.replaceChildren();
    const e = document.createElement('div');
    e.className = 'tui-empty';
    e.textContent = 'loading…';
    tuiList.append(e);
    const sub = tuiPath.map(encodeURIComponent).join('/');
    try {
      const r = await fetch('/api/list/' + (sub ? sub + '/' : ''), { headers: { Accept: 'application/json' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const arr = await r.json();
      if (seq !== tuiSeq) return;
      const items = arr
        .filter((x) => (x.type === 'file' || x.type === 'directory') && x.name !== 'index.html')
        .map((x) => ({ name: x.name, type: x.type, size: x.size, mtime: x.mtime }))
        .sort((a, b) => (a.type === b.type
          ? a.name.localeCompare(b.name, 'zh')
          : a.type === 'directory' ? -1 : 1));
      tuiFiles = tuiPath.length ? [{ name: '..', type: 'up' }, ...items] : items;
      tuiSel = 0;
      tuiPathEl.textContent = where;
      renderTui();
    } catch (err) {
      if (seq !== tuiSeq) return;
      tuiMeta.textContent = 'failed to load';
      e.textContent = 'failed to load ' + where + ' — ' + err.message;
    }
  }

  function enterTui() {
    if (dlg.classList.contains('tui')) return;
    dlg.classList.add('tui');
    tuiPath = [];
    loadTui();
    tuiList.focus({ preventScroll: true });
  }

  function exitTui() {
    if (!dlg.classList.contains('tui')) return;
    dlg.classList.remove('tui');
    tuiPath = [];
    input.focus({ preventScroll: true });
    body.scrollTop = body.scrollHeight;
  }

  dlg.addEventListener('keydown', (e) => {
    if (!dlg.classList.contains('tui')) return;
    const onButton = !!e.target.closest('button');
    const ctrl = e.ctrlKey || e.metaKey;
    const k = e.key;
    if (k === 'ArrowDown') { e.preventDefault(); selectRow(tuiSel + 1, true); }
    else if (k === 'ArrowUp') { e.preventDefault(); selectRow(tuiSel - 1, true); }
    else if (k === 'Home') { e.preventDefault(); selectRow(0, true); }
    else if (k === 'End') { e.preventDefault(); selectRow(tuiFiles.length - 1, true); }
    else if (k === 'PageDown') { e.preventDefault(); selectRow(tuiSel + 10, true); }
    else if (k === 'PageUp') { e.preventDefault(); selectRow(tuiSel - 10, true); }
    else if (k === 'Backspace' && tuiPath.length) {
      e.preventDefault();
      tuiPath.pop();
      loadTui();
    }
    else if (k === 'Enter') {
      if (onButton) return;
      e.preventDefault();
      openSelected();
    }
    else if (ctrl && (k === 'r' || k === 'R')) { e.preventDefault(); loadTui(); }
    else if (ctrl && (k === 'q' || k === 'Q')) { e.preventDefault(); exitTui(); }
  });
  // 滚轮：移动选中项而不是单独滚动视图，保证回车目标始终可见
  let wheelAcc = 0;
  tuiList.addEventListener('wheel', (e) => {
    if (!dlg.classList.contains('tui') || !tuiFiles.length) return;
    e.preventDefault();
    wheelAcc += e.deltaY * (e.deltaMode === 1 ? 16 : 1);
    const step = 48;
    let guard = 24;
    while (wheelAcc >= step && guard--) { selectRow(tuiSel + 1, true); wheelAcc -= step; }
    while (wheelAcc <= -step && guard--) { selectRow(tuiSel - 1, true); wheelAcc += step; }
  }, { passive: false });

  tuiList.addEventListener('click', (e) => {
    const row = e.target.closest('.tui-row');
    if (!row) return;
    const i = Number(row.dataset.i);
    if (i === tuiSel) { downloadRow(); return; }
    selectRow(i, false);
    tuiList.focus({ preventScroll: true });
  });

  function help() {
    line('available commands:');
    const cmds = [
      ['--help', 'show this help'],
      ['ls', 'list directories'],
      ['pwd', 'print working directory'],
      ['cd /dl', 'enter the download center'],
      ['cd /files', 'open the file list'],
      ['cd /', 'back to home (closes this window)'],
      ['exit', 'close this window'],
      ['clear', 'clear the screen'],
      ['↑ / ↓', 'browse command history'],
    ];
    for (const [c, d] of cmds) rich([['  ' + c.padEnd(11), 'cmd'], [d, 'dim']]);
  }

  function go(url, label) {
    if (navigating) return;
    navigating = true;
    line('opening ' + label + ' ...', 'ok');
    input.disabled = true;
    setTimeout(() => { location.href = url; }, 520);
  }

  const maxBtn = document.getElementById('termMax');
  let maximized = false;
  function setMax(on, focus = true) {
    maximized = on;
    dlg.classList.toggle('max', on);
    const label = on ? '还原' : '最大化';
    maxBtn.setAttribute('aria-label', label);
    maxBtn.title = label;
    if (focus) {
      input.focus({ preventScroll: true });
      body.scrollTop = body.scrollHeight;
    }
  }

  function closeTerm() {
    if (navigating || !dlg.open) return;
    document.documentElement.classList.remove('term-open');
    if (reduce.matches) return dlg.close();
    dlg.classList.add('closing');
    setTimeout(() => { dlg.classList.remove('closing'); dlg.close(); }, 160);
  }

  function run(raw) {
    const text = raw.trim();
    if (!text) return line('', '');
    line(PROMPT + ' ' + text, 'cmd');
    const low = text.toLowerCase();

    if (low === '--help' || low === 'help') return help();
    if (low === 'exit') { line('logout', 'dim'); return closeTerm(); }
    if (low === 'ls') return line('/dl/   /files/', 'dim');
    if (low === 'pwd') return line('/', 'dim');
    if (low === 'clear') { log.replaceChildren(); return; }

    const m = text.match(/^cd(?:\s+(.*))?$/i);
    if (m) {
      let raw2 = (m[1] || '').trim();
      if (!raw2) raw2 = '~';
      let p = raw2.toLowerCase();
      if (p === '~' || p === '/' || p === '/~' || p === '~/') {
        line('logout', 'dim');
        return closeTerm();
      }
      p = p.replace(/\/+$/, '');
      if (!p) p = '/';
      if (p[0] !== '/') p = '/' + p;
      if (p === '/dl') return enterTui();
      if (p === '/files') return go('/files/', '/files/');
      return line('cd: no such file or directory: ' + raw2, 'err');
    }

    line('command not found: ' + text.split(/\s+/)[0], 'err');
  }

  function openTerm() {
    if (dlg.open || opening) return;
    opening = true;
    navigating = false;
    setMax(false, false);
    dlg.classList.remove('tui');
    tuiSeq++;
    tuiFiles = [];
    tuiPath = [];
    log.replaceChildren();
    input.value = '';
    input.disabled = false;
    // 同步 showModal + focus：iOS 只允许用户手势内唤起软键盘
    dlg.showModal();
    document.documentElement.classList.add('term-open');
    line('SJDHQTL OS 1.0  (tty0)', 'dim');
    line('type --help for available commands', 'dim');
    line('', '');
    input.focus({ preventScroll: true });
    opening = false;
  }

  // 命令历史：↑ 往前翻、↓ 往后翻，未提交的草稿会被保留
  const history = [];
  let histIdx = 0;
  let draft = '';
  const caretEnd = () => {
    const n = input.value.length;
    try { input.setSelectionRange(n, n); } catch {}
  };
  input.addEventListener('keydown', (e) => {
    if (input.disabled) return;
    if (e.key === 'ArrowUp') {
      if (!history.length) return;
      e.preventDefault();
      if (histIdx === history.length) draft = input.value;
      if (histIdx > 0) histIdx--;
      input.value = history[histIdx];
      caretEnd();
    } else if (e.key === 'ArrowDown') {
      if (histIdx >= history.length) return;
      e.preventDefault();
      histIdx++;
      input.value = histIdx === history.length ? draft : history[histIdx];
      caretEnd();
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.disabled) return;
    const v = input.value;
    input.value = '';
    if (v.trim()) {
      history.push(v);
      if (history.length > 100) history.shift();
    }
    histIdx = history.length;
    draft = '';
    run(v);
  });
  // 模态框里只有「红点 + 输入框」两个可聚焦元素，显式循环，避免 Tab 落空
  dlg.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab' || !dlg.open) return;
    const els = [closeBtn, maxBtn, tuiList, input].filter((el) => el.offsetParent !== null && !el.disabled);
    if (!els.length) return;
    const first = els[0];
    const last = els[els.length - 1];
    const active = document.activeElement;
    if (e.shiftKey) {
      if (active === first || !dlg.contains(active)) {
        e.preventDefault();
        last.focus({ preventScroll: true });
      }
    } else if (active === last || !dlg.contains(active)) {
      e.preventDefault();
      first.focus({ preventScroll: true });
    }
  });
  closeBtn.addEventListener('click', closeTerm);
  maxBtn.addEventListener('click', () => setMax(!maximized));
  dlg.querySelector('.term-bar').addEventListener('dblclick', (e) => {
    if (e.target.closest('button')) return;
    setMax(!maximized);
  });
  // 点外部区域不关闭，只把焦点送回提示符；退出只有「红点」或 exit / cd /
  dlg.addEventListener('click', (e) => {
    if (e.target === dlg || (body.contains(e.target) && !closeBtn.contains(e.target))) {
      input.focus({ preventScroll: true });
    }
  });
  dlg.addEventListener('cancel', (e) => {
    e.preventDefault();
    input.focus({ preventScroll: true });
  });
  // 静默聚焦：焦点回到图标，但不显示焦点框（否则键盘 exit 后会多一个方框）
  dlg.addEventListener('close', () => {
    document.documentElement.classList.add('quiet-focus');
    link.focus({ preventScroll: true });
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') document.documentElement.classList.remove('quiet-focus');
  }, true);
  document.addEventListener('pointerdown', () => {
    document.documentElement.classList.remove('quiet-focus');
  }, true);
  link.addEventListener('click', (e) => {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    openTerm();
  });
})();
</script>
</body>
</html>
